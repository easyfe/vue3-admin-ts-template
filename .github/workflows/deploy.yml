name: Site Deploy

on:
    workflow_dispatch:
    push:
        branches:
            - arco-design
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # 安装 pnpm
            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install

            - name: Build
              run: |
                  sed -i 's|VITE_APP_BASE_ROUTE=./|VITE_APP_BASE_ROUTE=/vue3-admin-ts-template/|' $(pwd)/.env
                  pnpm build:test
                  cp dist/index.html dist/404.html

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: dist
